[project]
name = "lingjun"
version = "0.1.0"
description = ""
authors = [{ name = "lzl", email = "lzlworksharder@163.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars==1.9.0",
    "scikit-learn>=1.5.2",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "tqdm>=4.66.5",
    "wandb>=0.18.5",
    "python-dotenv>=1.0.1",
    "kaggle>=1.6.17",
    "grpcio>=1.67.0",
    "pyarrow>=17.0.0",
    "pytz>=2024.2",
    "torch",                # 不锁版本，由系统环境决定
    "torch_optimizer==0.3.0",
    "ipykernel>=7.2.0",
    "duckdb>=1.5.0",
    "xgboost>=2.1.0",       # 注意：目前 xgboost 还没有 3.2.0，建议写 >=2.1.0
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
url = "http://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
