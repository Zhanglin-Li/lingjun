# Training configuration - 前 160 特征版本

# Data paths
data:
  path_parquet: "data/filtered.parquet"
  col_target: "LabelA"
  col_id: "stockid"
  col_date: "dateid"
  col_time: "timeid"
  col_weight: null
  cols_responders:
    - "LabelB"
    - "LabelC"

# Model configuration
model:
  type: "gru"
  hidden_sizes:
    - 500
  dropout_rates:
    - 0.3
    - 0.0
    - 0.0
  hidden_sizes_linear:
    - 500
    - 300
  dropout_rates_linear:
    - 0.2
    - 0.1

# Training configuration
training:
  batch_size: 16
  lr: 0.0005
  lr_online: 0.00006
  epochs_per_seed:
    0: 1000
  seed_range:
    - 0
  early_stopping: true
  early_stopping_patience: 3
  checkpoint_interval: 5
  online_learning: false

# Data split
split:
  train_days: 288
  valid_days: 72

# Feature configuration - 前 160 特征, cols_corr 自动取前 32 个 (160/5)
