# Training configuration - Top 50 features, BS=1 for memory optimization

# Data paths
data:
  path_parquet: "data/train.parquet"
  col_target: "LabelA"
  col_id: "stockid"
  col_date: "dateid"
  col_time: "timeid"
  col_weight: null
  cols_responders:
    - "LabelB"
    - "LabelC"

# Model configuration (exp_012 best)
model:
  type: "gru"
  hidden_sizes:
    - 512
    - 256
  dropout_rates:
    - 0.1
    - 0.1
    - 0.0
  hidden_sizes_linear:
    - 500
    - 300
  dropout_rates_linear:
    - 0.2
    - 0.1

# Training configuration
training:
  batch_size: 1
  lr: 0.0001
  lr_online: 0.00006
  epochs_per_seed:
    0: 200
  seed_range:
    - 0
  early_stopping: true
  early_stopping_patience: 10
  checkpoint_interval: 5
  online_learning: true

# Data split
split:
  train_days: 288
  valid_days: 72

# Feature configuration - Top 50 features only
features:
  t_rolling: 239
  cols_init:
